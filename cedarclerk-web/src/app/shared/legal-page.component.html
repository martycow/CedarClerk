<div class="door">
    <app-button class="theme-toggle" variant="paper" surface="chrome" size="sm" title="Toggle theme"
                (clicked)="theme.toggle()">
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" size="xs" />
    </app-button>

    <app-paper-card class="legal-card" [rotate]="-0.2">
        <div class="legal-header">
            <app-cedar-logo [size]="28"></app-cedar-logo>
            <div class="legal-title">{{ title }}</div>
            @if (updated) { <div class="legal-updated">Last updated: {{ updated }}</div> }
        </div>

        <div class="legal-body">
            <ng-content></ng-content>
        </div>

        <div class="legal-footer"><a routerLink="/login">&larr; Back</a></div>
    </app-paper-card>
</div>
