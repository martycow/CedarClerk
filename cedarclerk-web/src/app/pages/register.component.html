<div class="auth-page">
    <button class="theme-toggle" (click)="theme.toggle()" [title]="t().common.toggleTheme">
        {{ theme.theme() === 'dark' ? '☀' : '☾' }}
    </button>

    <div class="auth-card">
        <div class="auth-header">
            <app-cedar-logo [size]="28"></app-cedar-logo>
            <div class="auth-title">{{ t().register.title }}</div>
            <div class="auth-tagline">{{ t().register.tagline }}<br>{{ t().register.taglineAsk }}</div>
        </div>

        <div class="field">
            <label for="cc-reg-email">{{ t().register.email }}</label>
            <input id="cc-reg-email" [(ngModel)]="email" placeholder="you@example.com" type="email" autocomplete="username">
        </div>
        <div class="field">
            <label for="cc-reg-pass">{{ t().register.password }}</label>
            <input id="cc-reg-pass" [(ngModel)]="password" [placeholder]="t().register.passwordPlaceholder" type="password" autocomplete="new-password">
        </div>
        <div class="field">
            <label for="cc-reg-invite">{{ t().register.inviteCode }}</label>
            <input id="cc-reg-invite" class="mono" [(ngModel)]="inviteCode" placeholder="CEDAR-MOO-0" type="text" autocomplete="off" (keyup.enter)="submit()">
        </div>

        @if (error()) {
        <div class="field-error">{{ error() }}</div>
        }

        <button class="primary-btn" (click)="submit()" [disabled]="busy()">
            {{ busy() ? '…' : t().register.submit }}
        </button>

        <div class="auth-footer">{{ t().register.haveAccount }} <a routerLink="/login">{{ t().register.login }}</a></div>
        <div class="auth-footer muted">{{ t().register.legalPrefix }} <a routerLink="/terms">{{ t().register.legalTerms }}</a> {{ t().register.legalAnd }} <a routerLink="/privacy">{{ t().register.legalPrivacy }}</a></div>
    </div>
</div>
