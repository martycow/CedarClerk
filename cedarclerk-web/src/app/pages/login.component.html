<div class="auth-page">
    <span class="wk-decor wk-band" aria-hidden="true"></span>
    <span class="wk-decor wk-haze" aria-hidden="true"></span>
    <span class="wk-decor wk-firefly wk-firefly-1" aria-hidden="true"></span>
    <span class="wk-decor wk-firefly wk-firefly-2" aria-hidden="true"></span>

    <button class="theme-toggle" (click)="theme.toggle()" [title]="t().common.toggleTheme">
        {{ theme.theme() === 'dark' ? '☀' : '☾' }}
    </button>

    <div class="auth-card">
        <span class="wk-decor wk-door-paper" aria-hidden="true"></span>
        <span class="wk-decor wk-hinge wk-hinge-top" aria-hidden="true"></span>
        <span class="wk-decor wk-hinge wk-hinge-bottom" aria-hidden="true"></span>
        <span class="wk-decor wk-handle" aria-hidden="true"></span>
        <div class="auth-header">
            <app-cedar-logo [size]="34"></app-cedar-logo>
            <div class="auth-title">Cedar Clerk</div>
            <div class="auth-tagline">{{ t().login.tagline }}</div>
        </div>

        @if (auth.serverUnreachable()) {
        <p class="session-notice">
            {{ t().login.serverUnreachable }}
            <button type="button" (click)="retrySession()" [disabled]="probing()">
                {{ probing() ? t().login.retrying : t().login.retry }}
            </button>
        </p>
        }

        <div class="field">
            <label for="cc-login-email">{{ t().login.email }}</label>
            <input id="cc-login-email" [(ngModel)]="email" placeholder="you@example.com" type="email" autocomplete="username">
        </div>
        <div class="field">
            <label for="cc-login-pass">{{ t().login.password }}</label>
            <input id="cc-login-pass" [(ngModel)]="password" placeholder="••••••••" type="password" autocomplete="current-password" (keyup.enter)="submit()">
        </div>

        <button class="primary-btn" (click)="submit()" [disabled]="busy()">
            {{ busy() ? '…' : t().login.submit }}
        </button>

        @if (error()) { <p class="error">{{ error() }}</p> }

        <div class="auth-footer">{{ t().login.noAccount }} <a routerLink="/register">{{ t().login.register }}</a> <span class="muted">{{ t().login.inviteRequired }}</span></div>

        <app-lang-switch></app-lang-switch>
    </div>
</div>
