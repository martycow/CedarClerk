<div class="auth-page">
    <button class="theme-toggle" (click)="theme.toggle()" [title]="t().common.toggleTheme">
        {{ theme.theme() === 'dark' ? '☀' : '☾' }}
    </button>

    <div class="auth-card">
        <div class="auth-header">
            <app-cedar-logo [size]="34"></app-cedar-logo>
            <div class="auth-title">Cedar Clerk</div>
            <div class="auth-tagline">{{ t().login.tagline }}</div>
        </div>

        <div class="field">
            <label for="cc-login-email">{{ t().login.email }}</label>
            <input id="cc-login-email" [(ngModel)]="email" placeholder="you@example.com" type="email" autocomplete="username">
        </div>
        <div class="field">
            <label for="cc-login-pass">{{ t().login.password }}</label>
            <input id="cc-login-pass" [(ngModel)]="password" placeholder="••••••••" type="password" autocomplete="current-password" (keyup.enter)="submit()">
        </div>

        <button class="primary-btn" (click)="submit()" [disabled]="busy()">
            {{ busy() ? '…' : t().login.submit }}
        </button>

        @if (error()) { <p class="error">{{ error() }}</p> }

        <div class="auth-footer">{{ t().login.noAccount }} <a routerLink="/register">{{ t().login.register }}</a> <span class="muted">{{ t().login.inviteRequired }}</span></div>
    </div>
</div>
