<app-auth-layout>
    <section class="card auth-card" data-surface="paper">
        <form (submit)="$event.preventDefault(); submit()">
        <div class="auth-header">
            <h1 class="auth-title">{{ t().externalAuth.completeTitle }}</h1>
            <div class="auth-tagline">{{ t().externalAuth.completeTagline }}</div>
        </div>

        <!--Same live preview as /register: a name is a public address the moment it is taken, and
        there is still no rename.-->
        <div class="username-field">
            <app-input inputId="cc-ext-username" [label]="t().register.username"
                       placeholder="alexwriter" autocomplete="off"
                       [hint]="t().register.usernameHint(blogHost())"
                       [value]="username()" (valueChange)="onUsernameInput($any($event) ?? '')" />
            @if (usernameNote()) {
            <div class="username-note" [class.ok]="usernameTone() === 'ok'"
                 [class.bad]="usernameTone() === 'bad'">{{ usernameNote() }}</div>
            }
        </div>

        <app-input class="invite" inputId="cc-ext-invite" [label]="t().register.inviteCode"
                   placeholder="CEDAR-MOO-0" autocomplete="off"
                   [value]="inviteCode" (valueChange)="inviteCode = $any($event) ?? ''" />

        @if (error()) {
        <div class="field-error">{{ error() }}</div>
        }

        <app-button class="primary-btn" variant="pine" [disabled]="busy()" type="submit">
            {{ busy() ? '…' : t().externalAuth.completeSubmit }}
        </app-button>

        </form>
        <app-lang-switch></app-lang-switch>
    </section>
</app-auth-layout>
