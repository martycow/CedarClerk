<div class="door">
    <app-theme-menu class="theme-toggle" />

    <section class="card auth-card" data-surface="paper">
        <div class="auth-header">
            <app-cedar-logo [size]="28"></app-cedar-logo>
            <div class="auth-title">{{ t().onboarding.title }}</div>
            <div class="auth-tagline">{{ t().onboarding.tagline }}</div>
        </div>

        <app-input inputId="cc-onb-name" [label]="t().onboarding.displayName"
                   [placeholder]="t().onboarding.displayNamePlaceholder" autocomplete="name"
                   [value]="displayName" (valueChange)="displayName = $any($event) ?? ''"
                   (keyup.enter)="submit()" />
        <app-input inputId="cc-onb-url" type="url" [label]="t().onboarding.profileUrl"
                   [placeholder]="t().onboarding.profileUrlPlaceholder" autocomplete="url"
                   [value]="profileUrl" (valueChange)="profileUrl = $any($event) ?? ''"
                   (keyup.enter)="submit()" />
        <label for="onboarding-location">{{ t().onboarding.location }}</label>
        <app-location-input inputId="onboarding-location" [value]="location" [placeholder]="t().onboarding.locationPlaceholder" (valueChange)="location = $event" />

        @if (auth.blogUrl(); as blog) {
        <div class="blog-address">
            <span class="blog-label">{{ t().onboarding.blogLabel }}</span>
            <a class="blog-url" [href]="blog" target="_blank" rel="noopener">{{ blog }}</a>
            <p class="blog-hint">{{ t().onboarding.blogHint }}</p>
        </div>
        }

        @if (error()) {
        <p class="field-error"><app-icon name="warning" size="xs" />{{ error() }}</p>
        }

        <app-button class="primary-btn" variant="pine" [disabled]="busy()" (clicked)="submit()">
            {{ busy() ? '…' : t().onboarding.submit }}
        </app-button>

        <app-lang-switch></app-lang-switch>
    </section>
</div>
