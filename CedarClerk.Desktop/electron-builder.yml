# Packaging for the desktop shell (T-121, ADR-104). Run through `cedar build --installer`, which
# publishes the server into ./server/ first — electron-builder only wraps what is already there.
appId: dev.mooexe.cedarclerk
productName: Cedar Clerk
copyright: Marty (martycow)

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - package.json

# The published self-contained server, copied beside the app rather than into the asar: it is a
# native executable and has to stay a real file on disk to be spawned.
extraResources:
  - from: server
    to: server

# ADR-116 — where an installed copy looks for a newer version. `generic` means "a folder on an HTTPS
# host": our own server serves it out of CEDAR_DATA_DIR/downloads (DownloadEndpoints.cs), which is
# why this needs no repository, no token and no third-party account. Also what makes electron-builder
# emit latest.yml and the .blockmap beside the installer — without a publish block there is no
# manifest, and without a manifest nothing updates.
publish:
  provider: generic
  url: https://cedarclerk.mooexe.dev/downloads
  # Cloudflare does not answer multi-range requests, and a differential download that asks for one
  # gets a full body back — slower than not trying. Sequential single ranges work.
  useMultipleRangeRequest: false

win:
  target:
    - target: nsis
      arch: [x64]
  # No code signing yet — an unsigned build gets a SmartScreen warning on first run, and buying a
  # certificate is a decision, not a build step (docs/DESKTOP.md, "Risks").
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # A per-user install writes nothing to Program Files, so no elevation prompt.
  artifactName: CedarClerk-Setup-${version}.${ext}

# macOS and Linux targets are omitted on purpose: nobody has a machine to verify them on, and an
# untested installer is worse than an absent one.
