[package]
name = "cedar-cli"
version = "0.1.0"
edition = "2024"
description = "Cedar operations console — deploy, test and run your programs"
publish = false

[[bin]]
name = "cedar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
